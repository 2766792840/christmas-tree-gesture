name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: unit tests
        run: npm run test
      - name: build
        run: npm run build
      - name: upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: app/dist
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    needs: check
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: install chromium
        run: npx playwright install --with-deps chromium
      - name: build
        run: npm run build
      - name: e2e (visual smoke + fallback + i18n)
        run: npx playwright test
      - name: upload playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            app/playwright-report
            app/test-results
          if-no-files-found: ignore
